<template data-id="c1-offer" data-cap="1 · Предложение">
<div class="view">
  <div class="glow"></div>
  <div class="nav"><div class="ic-btn"><i data-ic="close"></i></div></div>
  <div class="body" style="gap:22px">
    <div class="card hi" style="padding:20px; gap:14px; margin-top:6px">
      <div class="row" style="gap:18px">
        <div class="ring" data-size="144" data-ring="1,0,0" data-rate="10,5%" data-label="с первого дня"></div>
        <div class="col sp" style="gap:11px">
          <div class="row gap10"><div class="check" style="width:22px; height:22px"><i data-ic="check" data-s="14" data-w="3" style="color:var(--on-mint)"></i></div><div class="col"><div class="tb" style="font-size:16px">+1 за приток</div><div class="ts" style="font-size:13px">зарплата приходит сюда</div></div></div>
          <div class="row gap10"><div class="radio" style="width:22px; height:22px"></div><div class="col"><div class="tb" style="font-size:16px">+1 за стаж</div><div class="ts" style="font-size:13px">три месяца без снятия</div></div></div>
          <div class="row gap10"><div class="radio" style="width:22px; height:22px"></div><div class="col"><div class="tb" style="font-size:16px">+1 за запас</div><div class="ts" style="font-size:13px">хватит на три месяца</div></div></div>
        </div>
      </div>
      <div class="sep" style="background:var(--hi-line); opacity:.5"></div>
      <div class="row"><i data-ic="shield" data-s="22" class="mint"></i><span class="tb">На запас</span><span class="sp"></span><span class="num" style="font-size:19px; font-weight:600; letter-spacing:-.6px; white-space:nowrap">10,5% <span class="mint">→ до&nbsp;12,5%</span></span></div>
      <div class="row"><i data-ic="pay" data-s="22" class="mint"></i><div class="col sp" style="gap:0"><span class="tb">На каждый день</span><span class="ts" style="font-size:13px">на новые деньги</span></div><span class="num" style="font-size:20px; font-weight:600; letter-spacing:-.6px">6%</span></div>
    </div>
    <div class="h1" style="font-size:30px">Накопительный счёт, которым можно платить</div>
    <div class="col" style="gap:16px">
      <div class="row"><div class="av s g"><i data-ic="shield" data-s="20" class="mint"></i></div><div class="t ink">С первого дня — 10,5% на&nbsp;запас. За&nbsp;три привычки ставка вырастет до&nbsp;12,5%</div></div>
      <div class="row"><div class="av s g"><i data-ic="pay" data-s="20" class="mint"></i></div><div class="t ink">Остальным платите картой и&nbsp;SberPay</div></div>
      <div class="row"><div class="av s g"><i data-ic="bolt" data-s="20" class="mint"></i></div><div class="t ink">Проценты считаем каждый день и&nbsp;выплачиваем назавтра</div></div>
    </div>
  </div>
  <div class="foot"><div class="cta">Открыть за минуту</div><div class="ts" style="text-align:center">Бесплатно. Закрыть можно в&nbsp;любой момент.</div></div>
</div>
</template>

<template data-id="c1-floor" data-cap="2 · Запас на месяц">
<div class="view">
  <div class="nav"><div class="ic-btn"><i data-ic="back"></i></div><div class="lbl">Шаг 1 из 2</div><div style="width:40px"></div></div>
  <div class="body" style="gap:14px">
    <div class="h1" style="margin-bottom:4px">Сколько оставить в&nbsp;запасе на&nbsp;декабрь?</div>
    <div class="card hi" style="gap:14px; padding:20px">
      <div class="row"><div class="lbl hl">Запас · сейчас 10,5%</div><span class="sp"></span><div class="pill solid" data-a="floorEarn">+2&nbsp;140&nbsp;₽ за месяц</div></div>
      <div class="amount" data-a="amount"><div class="big" data-anim="floor-num">240&nbsp;000&nbsp;₽</div><i data-ic="edit" data-s="20" class="soft"></i></div>
      <div class="slider"><div class="trk"></div><div class="fil" style="width:80%" data-anim="floor-fil"></div><div class="mark" style="left:80%"></div><div class="knb" style="left:80%" data-anim="floor-knb"></div></div>
      <div class="row"><div class="lbl">0&nbsp;₽</div><span class="sp"></span><div class="lbl">300&nbsp;000&nbsp;₽ на счёте</div></div>
      <div class="presets">
        <div class="preset on" data-preset="240000"><div class="lbl">совет банка</div><div class="sm">240&nbsp;000&nbsp;₽</div></div>
        <div class="preset" data-preset="84000"><div class="lbl">1 месяц трат</div><div class="sm">84&nbsp;000&nbsp;₽</div></div>
        <div class="preset" data-preset="168000"><div class="lbl">2 месяца трат</div><div class="sm">168&nbsp;000&nbsp;₽</div></div>
      </div>
    </div>
    <div class="info"><i data-ic="spark" data-s="20" class="mint"></i><div class="ts">Совет банка: за&nbsp;3&nbsp;месяца ваш остаток не&nbsp;опускался ниже <b class="ink">240&nbsp;000&nbsp;₽</b>. Сумму можно ввести — нажмите на&nbsp;число.</div></div>
    <div class="card">
      <div class="row"><span class="dot l-core"></span><div class="col sp"><div class="tb">Запас</div><div class="ts">10,5% сейчас · вырастет до 12,5%</div></div><div class="sm" data-a="floorCore">240&nbsp;000&nbsp;₽</div></div>
      <div class="sep"></div>
      <div class="row"><span class="dot l-flow"></span><div class="col sp"><div class="tb">На каждый день</div><div class="ts">6% на новые деньги · карта, SberPay</div></div><div class="sm" data-a="floorFlow">60&nbsp;000&nbsp;₽</div></div>
    </div>
  </div>
  <div class="foot"><div class="cta">Оставить в&nbsp;запасе на&nbsp;декабрь</div><div class="ts" style="text-align:center">Деньги доступны всегда: снять можно в&nbsp;любой день.</div></div>
</div>
</template>

<template data-id="c1-stream" data-cap="3 · Автопополнение">
<div class="view">
  <div class="nav"><div class="ic-btn"><i data-ic="back"></i></div><div class="lbl">Шаг 2 из 2</div><div style="width:40px"></div></div>

    <div class="h1" style="margin-bottom:6px">Пусть счёт пополняется сам</div>

      <div class="row"><div class="av g"><i data-ic="wallet" class="mint"></i></div><div class="col sp"><div class="tb">С зарплаты</div><div class="ts">10% с&nbsp;поступлений, ≈&nbsp;12&nbsp;000&nbsp;₽</div></div><div class="tog"></div></div>
      <div class="sep"></div>
      <div class="row"><div class="av b"><i data-ic="repeat" style="color:var(--blue)"></i></div><div class="col sp"><div class="tb">Из другого банка</div><div class="ts">5&nbsp;000&nbsp;₽ 1-го числа · нужно одно согласие в&nbsp;том банке</div></div><div class="tog off"></div></div>
      <div class="sep"></div>
      <div class="row"><div class="av a"><i data-ic="coins" class="amb"></i></div><div class="col sp"><div class="tb">Округление покупок</div><div class="ts">до 100&nbsp;₽, разница идёт в запас</div></div><div class="tog off"></div></div>
      <div class="sep"></div>
      <div class="row"><div class="av v"><i data-ic="cal" style="color:var(--violet)"></i></div><div class="col sp"><div class="tb">Остаток месяца</div><div class="ts">что не потратили — в запас</div></div><div class="tog off"></div></div>
    </div>
    <div class="card hi" style="padding:18px 20px; gap:11px">
      <div class="lbl hl">Счёт будет расти сам</div>
      <div class="row" style="align-items:baseline; gap:8px"><div class="big mint" style="font-size:40px">+12&nbsp;000&nbsp;₽</div><div class="t">в месяц</div></div>
      <div class="ts" data-a="streamSub">Включено: с&nbsp;зарплаты. Остальное включите сами, когда захотите</div>
      <div style="height:44px; display:flex; align-items:flex-end; gap:6px"><i style="flex:1; height:30%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:36%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:42%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:48%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:54%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:61%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:67%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:74%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:80%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:87%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:93%; border-radius:5px; background:#2F6B45"></i><i style="flex:1; height:100%; border-radius:5px; background:var(--mint)"></i></div>
      <div class="row"><div class="ts">Через год на счёте</div><span class="sp"></span><div class="sm">≈ 485&nbsp;000&nbsp;₽</div></div>
    </div>
  </div>
  <div class="foot"><div class="cta">Готово</div></div>
</div>
</template>

<template data-id="c1-home" data-cap="4 · Счёт">
<div class="view">
  <div class="glow" style="opacity:.55"></div>
  <div class="nav"><div class="ic-btn"><i data-ic="back"></i></div><div class="ttl">Накопительный счёт</div><div class="ic-btn"><i data-ic="more"></i></div></div>
  <div class="body scroll" style="gap:14px">
    <div class="col gap6" style="padding:2px 4px 0">
      <div class="lbl">Запаса хватит на</div>
      <div class="hero"><div class="big" data-a="life">2,9</div><div class="u">месяца жизни</div></div>
      <div class="sub2" style="margin-top:2px">На счёте <b data-anim="c1-total">300&nbsp;000&nbsp;₽</b></div>
      <div class="row gap8" style="margin-top:4px"><div class="pill"><i data-ic="bolt" data-s="14"></i><span>сегодня +<span class="num" data-anim="tick">51,28</span>&nbsp;₽ · выплатим завтра</span></div></div>
    </div>
    <div class="col gap8">
      <div class="layers"><i class="l-core" style="flex:240" data-anim="c1-core"></i><i class="l-flow" style="flex:60" data-anim="c1-flow"></i></div>

    </div>
    <div class="card hi" data-anim="ratecard" style="padding:16px; gap:12px">
      <div class="row" style="gap:16px">
        <div class="ring" data-size="124" data-ring="1,1,0.95" data-rate="11,5%" data-label="на запас"></div>
        <div class="col sp" style="gap:10px">
          <div class="row gap10" data-habit="0"><div class="check" style="width:22px; height:22px"><i data-ic="check" data-s="14" data-w="3" style="color:var(--on-mint)"></i></div><div class="col"><div class="tb" style="font-size:15.5px">Приток</div><div class="ts" style="font-size:13px">зарплата приходит сюда</div></div></div>
          <div class="row gap10" data-habit="1"><div class="check" style="width:22px; height:22px"><i data-ic="check" data-s="14" data-w="3" style="color:var(--on-mint)"></i></div><div class="col"><div class="tb" style="font-size:15.5px">Стаж</div><div class="ts" style="font-size:13px">6 месяцев без снятия</div></div></div>
          <div class="row gap10" data-habit="2"><div class="radio" style="width:22px; height:22px"></div><div class="col sp"><div class="tb" style="font-size:15.5px">Запас на три месяца</div><div class="ts mint" style="font-size:13px">2,9 из 3 · ещё +1</div></div></div>
        </div>
      </div>
      <div class="sep" style="background:var(--hi-line); opacity:.5"></div>
      <div class="ts" data-a="avg">На запас сегодня <b class="ink">11,5%</b> → до&nbsp;12,5%. В&nbsp;среднем по&nbsp;счёту — 10,4%</div>
    </div>
    <div class="row" style="justify-content:space-between; padding:0 26px">
      <div class="col" style="align-items:center; gap:7px"><div class="ic-btn" style="width:54px; height:54px; border-radius:27px"><i data-ic="down"></i></div><div class="ts soft">Пополнить</div></div>
      <div class="col" style="align-items:center; gap:7px" data-anim="c1-paybtn"><div class="ic-btn" style="width:54px; height:54px; border-radius:27px; background:var(--mint); color:var(--on-mint)"><i data-ic="pay"></i></div><div class="ts ink">Оплатить</div></div>
      <div class="col" style="align-items:center; gap:7px"><div class="ic-btn" style="width:54px; height:54px; border-radius:27px"><i data-ic="swap"></i></div><div class="ts soft">Перевести</div></div>
    </div>
    <div class="card" data-a="ops" style="gap:14px; padding:16px 18px">

</div>
