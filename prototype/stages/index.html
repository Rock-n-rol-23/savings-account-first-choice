<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Прототип: накопительный счёт первого выбора — версия 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=Golos+Text:wght@400..700&display=swap">
<style>
/* Прототип «Накопительный счёт первого выбора» — экраны под iPhone 18 Pro Max (440 × 956 pt).
   Палитра и шрифты совпадают с декой: графит + зелёный, Geologica (числа, заголовки), Golos Text (текст). */

:root {
  --bg: #0A0E0C;
  --bg2: #101614;
  --card: #161D1A;
  --card2: #1C2521;
  --line: #27312D;
  --line2: #34403B;
  --ink: #F0F4EE;
  --soft: #B4C0B9;
  --mute: #8A9891;
  --green: #21A038;
  --mint: #57D98A;
  --mint-d: #12261A;
  --amber: #F0B341;
  --coral: #F08A73;
  --blue: #6FB7FF;
  --violet: #B79CFF;
  --k: 1;
  /* производные: всё, что раньше было зашито в вёрстку, чтобы светлая тема менялась одной заменой */
  --on-mint: #06140B;
  --fill: rgba(255,255,255,.07);
  --fill2: rgba(255,255,255,.09);
  --hi-a: #173322; --hi-b: #101C16; --hi-line: rgba(87,217,138,.5);
  --hi-lbl: #9FE0B7;
  --sheet: #151B18;
  --glass: rgba(34,42,38,.72); --glass-line: rgba(255,255,255,.1);
  --trk: #27322D;
  --tank: #0E1411; --tank-line: #2A3530;
  --off: #39433F;
  --mint-ink: #57D98A;
  --amber-ink: #F0B341;
  --shadow: rgba(0,0,0,.5);
}
/* светлая тема: те же роли, фон и поверхности светлые; мятный остаётся цветом действия, для текста — тёмно-зелёный */
[data-theme="light"] {
  --bg: #F3F6F2; --bg2: #EAEFE9; --card: #FFFFFF; --card2: #EEF2EC; --line: #DDE4DD; --line2: #C9D2CA;
  --ink: #0F1A14; --soft: #3F4C45; --mute: #5C6A63;
  --fill: rgba(15,26,20,.06); --fill2: rgba(15,26,20,.09);
  --hi-a: #E3F6EA; --hi-b: #F4FBF6; --hi-line: rgba(33,160,56,.45);
  --hi-lbl: #1B7A34;
  --sheet: #FFFFFF;
  --glass: rgba(255,255,255,.78); --glass-line: rgba(15,26,20,.1);
  --trk: #DDE6DE;
  --tank: #EAF0EA; --tank-line: #D3DCD4;
  --off: #C3CCC5;
  --mint-ink: #0F6B2C;
  --amber-ink: #8A5A00;
  --blue: #1F6FD0; --violet: #6E4FD6; --coral: #C2452B; --amber: #B97A00;
  --shadow: rgba(15,26,20,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; }
body {
  font-family: 'Golos Text', 'Golos Text', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}
.num, .g { font-family: 'Geologica', 'Geologica', 'Golos Text', sans-serif; font-variant-numeric: tabular-nums; }

/* ───────── корпус: 77,98 × 163,43 мм при 6,039 pt/мм ───────── */
.device {
  position: relative;
  width: 471px; height: 987px;
  flex: none;
}
.device .case {
  position: absolute; inset: 0;
  border-radius: 79px;
  background: linear-gradient(145deg, #4A524E 0%, #232927 22%, #151A18 50%, #2A302D 78%, #4A524E 100%);
  box-shadow: 0 0 0 1px #0A0D0C, inset 0 0 0 1.5px rgba(255,255,255,.14);
}
.device .bezel {
  position: absolute; inset: 4px;
  border-radius: 75px;
  background: #020403;
}
.device .btn { position: absolute; width: 3px; background: linear-gradient(90deg, #2C3330, #4A524E); border-radius: 2px; }
.device .b1 { left: -2.5px; top: 186px; height: 42px; }
.device .b2 { left: -2.5px; top: 259px; height: 68px; }
.device .b3 { left: -2.5px; top: 344px; height: 68px; }
.device .b4 { right: -2.5px; top: 282px; height: 107px; }
.device .screen {
  position: absolute; left: 15.5px; top: 15.5px;
  width: 440px; height: 956px;
  border-radius: 63px;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  isolation: isolate;
}
.device .island {
  position: absolute; left: 188px; top: 29.5px;
  width: 95px; height: 36.5px; border-radius: 19px;
  background: #000; z-index: 50;
}
.device .island::after { content: ''; position: absolute; right: 12px; top: 12.5px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #1D2A3A, #05070A 70%); }

/* ───────── экран ───────── */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.status {
  color: var(--ink);
  height: 62px; flex: none;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 38px 10px 46px;
  font-family: 'Geologica', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: -.2px;
  position: relative; z-index: 40;
}
.status .sys { display: flex; gap: 7px; align-items: center; }
.status svg { display: block; }
.home-ind { position: absolute; left: 150px; bottom: 9px; width: 140px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .72; z-index: 60; }

.nav { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.nav .ttl { font-size: 17px; font-weight: 600; }
.ic-btn { width: 40px; height: 40px; border-radius: 20px; background: var(--fill); display: flex; align-items: center; justify-content: center; }
.ic-btn.ghost { background: transparent; }

.body { flex: 1; min-height: 0; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 16px; }
.body.tight { gap: 13px; }

/* типографика */
.h1 { font-family: 'Geologica', sans-serif; font-size: 32px; line-height: 1.12; font-weight: 600; letter-spacing: -.6px; }
.h2 { font-family: 'Geologica', sans-serif; font-size: 22px; line-height: 1.18; font-weight: 600; letter-spacing: -.3px; }
.t { font-size: 16.5px; line-height: 1.35; color: var(--soft); }
.ts { font-size: 14.5px; line-height: 1.35; color: var(--mute); }
.tb { font-size: 17px; line-height: 1.3; font-weight: 600; color: var(--ink); }
.lbl { font-size: 13px; line-height: 1.3; color: var(--mute); letter-spacing: .1px; }
.mint { color: var(--mint-ink); }
.amb { color: var(--amber-ink); }
.coral { color: var(--coral); }
.ink { color: var(--ink); }
.soft { color: var(--soft); }
.big { font-family: 'Geologica', sans-serif; font-size: 50px; line-height: 1; font-weight: 600; letter-spacing: -1.6px; font-variant-numeric: tabular-nums; }
.mid { font-family: 'Geologica', sans-serif; font-size: 26px; line-height: 1.05; font-weight: 600; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
.sm { font-family: 'Geologica', sans-serif; font-size: 18px; line-height: 1.2; font-weight: 600; letter-spacing: -.2px; font-variant-numeric: tabular-nums; }
.r { color: var(--soft); font-weight: 400; }

/* карточки и ряды */
.card { background: var(--card); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.card.hi { background: linear-gradient(160deg, var(--hi-a) 0%, var(--hi-b) 70%); box-shadow: inset 0 0 0 1.5px var(--hi-line); }
/* на зелёной подложке третий тон текста не проходит 4,5:1 — берём второй */
.card.hi .ts:not(.mint):not(.ink):not(.amb), .card.hi .lbl:not(.ink) { color: var(--soft); }
.card.hi .lbl.hl { color: var(--hi-lbl); }
.card.flat { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.row { display: flex; align-items: center; gap: 12px; }
.row.top { align-items: flex-start; }
.sp { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.right { text-align: right; align-items: flex-end; }
.sep { height: 1px; background: var(--line); margin: 0 -2px; }
.gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }

.av { width: 48px; height: 48px; border-radius: 16px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--card2); }
.av.s { width: 40px; height: 40px; border-radius: 13px; }
.av.round { border-radius: 50%; }
.av.g { background: rgba(87,217,138,.16); } .av.a { background: rgba(240,179,65,.16); } .av.b { background: rgba(111,183,255,.16); }
.av.v { background: rgba(183,156,255,.16); } .av.c { background: rgba(240,138,115,.16); } .av.n { background: var(--fill2); }
.av.txt { font-family: 'Geologica', sans-serif; font-weight: 600; font-size: 16px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; font-weight: 600; background: rgba(87,217,138,.14); color: var(--mint-ink); white-space: nowrap; }
.pill.n { background: var(--fill); color: var(--soft); }
.pill.a { background: rgba(240,179,65,.15); color: var(--amber-ink); }
.pill.solid { background: var(--mint); color: var(--on-mint); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 38px; padding: 0 16px; border-radius: 19px; background: var(--fill); display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.chip.on { background: var(--mint); color: var(--on-mint); font-weight: 600; }

.cta { height: 58px; border-radius: 20px; background: var(--mint); color: var(--on-mint); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Geologica', sans-serif; font-size: 18px; font-weight: 600; letter-spacing: -.2px; flex: none; }
.cta.sec { background: var(--fill2); color: var(--ink); }
/* кнопка ждёт выбора: не нажимается, подпись читается */
.cta.wait { background: var(--fill2); color: var(--soft); }
.cta.dark { background: #000; color: #fff; box-shadow: inset 0 0 0 1px #2A322E; }
.foot { padding: 12px 20px 38px; display: flex; flex-direction: column; gap: 10px; flex: none; }

.bar { height: 10px; border-radius: 5px; background: var(--fill2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--mint); }
.bar.thick { height: 12px; border-radius: 6px; } .bar.thick i { border-radius: 6px; }

.tog { width: 52px; height: 32px; border-radius: 16px; background: var(--mint); position: relative; flex: none; }
.tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transform: translateX(20px); }
.tog.off { background: var(--off); } .tog.off::after { transform: translateX(0); }

/* нижняя панель вкладок: стекло */
.tabbar { position: absolute; left: 22px; right: 22px; bottom: 26px; height: 66px; border-radius: 33px; background: var(--glass); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--glass-line), 0 14px 36px var(--shadow); display: flex; align-items: center; justify-content: space-around; padding: 0 10px; z-index: 30; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 13px; font-weight: 500; color: var(--soft); min-width: 96px; }
.tab.on { color: var(--mint-ink); font-weight: 600; }

/* шторка */
.scrim { position: absolute; inset: 0; background: rgba(2,4,3,.62); z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 38px 38px 0 0; padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 14px; z-index: 25; box-shadow: 0 -1px 0 rgba(255,255,255,.08); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); align-self: center; margin-bottom: 4px; }

/* два слоя счёта */
.layers { display: flex; gap: 5px; height: 16px; }
.layers i { display: block; height: 100%; border-radius: 8px; }
.l-core { background: linear-gradient(90deg, #1E9A3A, #57D98A); }
.l-flow { background: var(--off); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* сегменты конвертов */
.segs { display: flex; gap: 4px; height: 14px; }
.segs i { display: block; height: 100%; border-radius: 7px; }
i.c-g { background: #57D98A; } i.c-b { background: #6FB7FF; } i.c-a { background: #F0B341; } i.c-v { background: #B79CFF; } i.c-c { background: #F08A73; } i.c-n { background: #4A5852; }
.bar i.c-g { background: #57D98A; } .bar i.c-b { background: #6FB7FF; } .bar i.c-a { background: #F0B341; } .bar i.c-v { background: #B79CFF; } .bar i.c-c { background: #F08A73; } .bar i.c-n { background: #6B7B74; }

/* слайдер */
.slider { position: relative; height: 34px; }
.slider .trk { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--fill2); }
.slider .fil { position: absolute; left: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--mint); }
.slider .knb { position: absolute; top: 2px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.45); margin-left: -15px; }
.slider .mark { position: absolute; top: 9px; width: 2px; height: 16px; border-radius: 1px; background: rgba(255,255,255,.35); }

.check { width: 26px; height: 26px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; flex: none; }
.radio { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line2); flex: none; }
.radio.on { box-shadow: inset 0 0 0 7px var(--mint); }
.badge { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--fill2); color: var(--soft); font-family: 'Geologica', sans-serif; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }

/* свечение на героях */
.glow { position: absolute; left: -60px; top: -40px; width: 560px; height: 420px; background: radial-gradient(closest-side, rgba(45,187,82,.32), rgba(45,187,82,0)); pointer-events: none; }

/* сцена для съёмки */
.stage { display: flex; align-items: center; justify-content: center; }
body.still { width: 477px; height: 987px; overflow: hidden; }
body.still .device { position: absolute; left: 3px; top: 0; }

/* ───────── кольцо ставки: три надбавки ───────── */
.ring { position: relative; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.ring-v { font-family: 'Geologica', sans-serif; font-weight: 600; letter-spacing: -.8px; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1; }
.ring-l { color: var(--mute); line-height: 1.2; }

/* ───────── запас прочности: три месяца ───────── */
.tanks { display: flex; gap: 12px; }
.tank { flex: 1; height: 150px; border-radius: 28px; background: var(--tank); box-shadow: inset 0 0 0 1.5px var(--tank-line); position: relative; overflow: hidden; }
.tank .liq { position: absolute; inset: 0; background: linear-gradient(180deg, #57D98A 0%, #1E9A3A 100%); transform: translateY(var(--lv, 0%)); }
.tank .wave { position: absolute; left: 0; top: -9px; width: 200%; height: 10px; display: block; }
.tank .tl { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13.5px; font-weight: 600; color: #06140B; z-index: 2; }
.spark { position: absolute; left: 0; top: 0; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #A5F5C0; opacity: 0; z-index: 75; pointer-events: none; }
.coin { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #57D98A; box-shadow: 0 0 0 4px rgba(87,217,138,.22); opacity: 0; z-index: 75; pointer-events: none; }

/* ───────── версия 2 ───────── */
/* главное число счёта: запас в месяцах жизни */
.hero { display: flex; align-items: baseline; gap: 10px; }
.hero .u { font-family: 'Geologica', sans-serif; font-size: 22px; line-height: 1.18; font-weight: 500; letter-spacing: -.3px; color: var(--soft); }
.sub2 { font-size: 15px; line-height: 1.35; color: var(--soft); }
.sub2 b { color: var(--ink); font-weight: 600; font-family: 'Geologica', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }

/* варианты в шторке: заголовок, последствие, метка */
.opt { border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; box-shadow: inset 0 0 0 1px var(--line); }
.opt .radio { margin-top: 1px; }
.opt.hi { background: linear-gradient(160deg, var(--hi-a) 0%, var(--hi-b) 70%); box-shadow: inset 0 0 0 1.5px var(--hi-line); }
.opt .ts { color: var(--soft); }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 13px; font-weight: 500; background: var(--fill2); color: var(--soft); white-space: nowrap; align-self: flex-start; margin-top: 5px; }
.tag.a { background: rgba(240,179,65,.16); color: var(--amber-ink); }
.tag.g { background: rgba(87,217,138,.14); color: var(--mint-ink); }
.info { display: flex; gap: 10px; align-items: flex-start; padding: 0 4px; }
.info .ts { color: var(--soft); }

/* легенда и подписи к цвету: цвет никогда не единственный признак */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.3; color: var(--soft); white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pct { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.grip { width: 28px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--mute); flex: none; margin-right: -6px; }
.edit { display: inline-flex; align-items: center; gap: 6px; }
.edit .sm { border-bottom: 1.5px dashed var(--line2); padding-bottom: 1px; }

/* пресеты суммы */
.presets { display: flex; gap: 8px; }
.preset { flex: 1; min-width: 0; border-radius: 16px; padding: 9px 10px; background: var(--fill); display: flex; flex-direction: column; gap: 2px; }
.preset .lbl { color: var(--soft); white-space: nowrap; }
.preset .sm { font-size: 15.5px; }
.preset.on { background: rgba(87,217,138,.16); box-shadow: inset 0 0 0 1.5px var(--hi-line); }
.amount { display: inline-flex; align-items: baseline; gap: 10px; align-self: flex-start; border-bottom: 2px dashed var(--line2); padding-bottom: 4px; }

/* столбцы по месяцам: прежние и новые деньги */
.cols { display: flex; align-items: flex-end; gap: 5px; height: 92px; }
.cols > div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; }
.cols i { display: block; border-radius: 4px; transform-origin: 50% 100%; }
.cols .o { background: var(--off); } .cols .n { background: var(--mint); }

/* прокрутка под стеклянной панелью: низ списка растворяется над панелью, а не уходит под неё */
.body.scroll { overflow-y: auto; scrollbar-width: none; padding-bottom: 112px; }
.body.scroll::-webkit-scrollbar { display: none; }
.body.scroll > * { flex: none; }
.view:has(> .tabbar) > .body { -webkit-mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 100px), transparent calc(100% - 88px)); mask-image: linear-gradient(180deg, #000 0, #000 calc(100% - 100px), transparent calc(100% - 88px)); }

[data-theme="light"] .glow { opacity: .35 !important; }
[data-theme="light"] .tog::after { box-shadow: 0 2px 6px rgba(15,26,20,.25); }
[data-theme="light"] .tank .liq { background: linear-gradient(180deg, #57D98A 0%, #2BB14B 100%); }

@media (prefers-reduced-motion: reduce) { .tank .wave { animation: none !important; } }
.card.rows { padding: 4px 16px; gap: 0; }
.er { padding: 10px 0; border-top: 1px solid var(--line); overflow: hidden; }
.er:first-child { border-top: none; }

.compact .er { padding: 8px 0; }
.compact .er .av.s { width: 34px; height: 34px; border-radius: 11px; }
.compact .ts { line-height: 1.3; }

/* Кликабельный прототип: сцена, подгонка под экран, отклик на нажатия */
html, body { height: 100%; margin: 0; background: #070A09; overflow: hidden; overscroll-behavior: none; }
body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#fit { width: 477px; height: 987px; flex: none; position: relative; transform-origin: 50% 50%; opacity: 0; transition: opacity .4s ease-out; }
body.ready #fit { opacity: 1; }
#fit .device { position: absolute; left: 3px; top: 0; }
.device .island { display: none; }
body.mobile #fit { width: 440px; height: 956px; }
body.mobile #fit .device { left: 0; width: 440px; height: 956px; }
body.mobile .device .case, body.mobile .device .bezel, body.mobile .device .btn { display: none; }
body.mobile .device .screen { left: 0; top: 0; border-radius: 0; }

.view { isolation: isolate; }
.view > .status, .view > .home-ind { visibility: hidden; }
.gstatus { position: absolute; left: 0; right: 0; top: 0; z-index: 85; pointer-events: none; }
.screen > .home-ind { z-index: 86; pointer-events: none; }

.menu-pill { position: absolute; left: 0; right: 0; top: 14px; margin: 0 auto; width: max-content; max-width: 412px; white-space: nowrap; height: 36px; padding: 0 15px; border-radius: 18px; background: #000; color: #F0F4EE; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; z-index: 95; box-shadow: 0 0 0 1px rgba(255,255,255,.1); }
.menu-pill b { color: #57D98A; font-weight: 600; margin-left: 3px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.22); }
.menu-pill b:empty { display: none; }
.toast { position: absolute; left: 0; right: 0; bottom: 112px; margin: 0 auto; width: max-content; max-width: 372px; box-sizing: border-box; padding: 13px 18px; border-radius: 20px; background: rgba(40,50,45,.9); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 14px 36px rgba(0,0,0,.5); color: #F0F4EE; font-size: 14.5px; line-height: 1.3; font-weight: 500; text-align: center; opacity: 0; z-index: 96; pointer-events: none; }
.halo-ring { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; box-shadow: 0 0 0 3px rgba(165,245,192,.9); opacity: 0; z-index: 74; pointer-events: none; }

.tp { cursor: pointer; transition: filter .16s ease-out, opacity .16s ease-out; }
.tp:active { filter: brightness(1.18); opacity: .86; }
.cta.tp, .chip.tp, .menu-pill.tp { transition: transform .16s cubic-bezier(.2,.7,.2,1), filter .16s ease-out; }
.cta.tp:active, .chip.tp:active, .menu-pill.tp:active { transform: scale(.97); opacity: 1; }
.sc { padding: 11px 2px; border-top: 1px solid rgba(255,255,255,.07); }
.tog { transition: background .2s ease-out; cursor: pointer; }
.tog::after { transition: transform .2s cubic-bezier(.23,1,.32,1); }
.tank .wave { animation: wave 2.2s linear infinite; }
@keyframes wave { to { transform: translateX(-50%); } }

/* объединённый прототип: прокрутка, строки счёта, карточка «дальше», уведомления */
.body.scroll { overflow-y: auto; scrollbar-width: none; padding-bottom: 112px; -webkit-overflow-scrolling: touch; }
.body.scroll::-webkit-scrollbar { display: none; }
.body.scroll > * { flex: none; }
.rpush { position: absolute; left: 12px; right: 12px; top: 54px; border-radius: 28px; padding: 14px 16px; background: rgba(40,50,45,.86); backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 18px 44px rgba(0,0,0,.55); display: flex; gap: 12px; align-items: center; z-index: 97; pointer-events: none; }

.opt.tp, .preset.tp { transition: transform .16s cubic-bezier(.2,.7,.2,1), filter .16s ease-out; }
.opt.tp:active, .preset.tp:active { transform: scale(.985); }
.cta.wait { cursor: default; }
.cta.wait:active { transform: none; filter: none; }
@media (prefers-reduced-motion: reduce) {
  .tp, .cta.tp, .chip.tp, .menu-pill.tp, .tog, .tog::after, #fit { transition: none !important; }
  .cta.tp:active, .chip.tp:active, .menu-pill.tp:active, .opt.tp:active { transform: none; }
}

</style>
</head>

function qr(el) {

      if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;

    return -1;
  };
  let h = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const f = finder(r, c), on = f === -1 ? rnd() > .52 : f;

  }

}

    const m = months(), tanks = v.querySelectorAll('.tank');
    v.querySelector('[data-anim="life"]').textContent = fmt1(Math.max(m - .1, 0));
    v.querySelector('[data-a="lifeSub"]').textContent = `${rub(A.core)} при расходах около ${rub(EXP)} в месяц`;
    gsap.set(v.querySelector('[data-a="six"]'), { scaleX: 0, transformOrigin: '0 50%' }); v.querySelector('[data-a="six"]').style.width = Math.min(m / 6, 1) * 100 + '%';
    tanks.forEach(t => { gsap.set(t.querySelector('.liq'), { yPercent: 100 }); t.querySelector('.tl').style.color = '#7F8D86'; });
    const full = m >= 3, gp = v.querySelector('[data-anim="goal-pill"]');
    gp.innerHTML = full ? '<i data-ic="check" data-s="14" data-w="3"></i>набраны' : `ещё ${rub(Math.max(3 * EXP - A.core, 0))}`; gp.querySelectorAll('[data-ic]').forEach(icon);
    const ring = v.querySelector('.ring'); arcSet(ring, [0, 0, 0]); ring.querySelector('.ring-v').textContent = fmt1(rate()) + '%';
    const txt = v.querySelectorAll('[data-anim="fullrate"] .col > div');
    txt[0].textContent = A.stage === 'full' ? 'Все три надбавки ваши' : 'Две надбавки из трёх'; txt[2].textContent = A.stage === 'full' ? 'ставка с января — 12,5%' : `ставка сейчас — ${fmt1(rate())}%`;
  };
  after['c1-growth'] = v => {
    const m = months(), tanks = [...v.querySelectorAll('.tank')], life = v.querySelector('[data-anim="life"]');
    tanks.forEach((t, i) => { const lv = Math.min(Math.max(m - i, 0), 1); gsap.to(t.querySelector('.liq'), { yPercent: (1 - lv) * 100, duration: 1, ease: 'power2.inOut', delay: .4 + i * .42 }); if (lv > .3) gsap.to(t.querySelector('.tl'), { color: '#06140B', duration: .3, delay: 1 + i * .42 }); });
    setTimeout(() => { if (cur !== 'c1-growth') return; count(life, Math.max(m - .1, 0), m, fmt1, .3); pulse(life, 1.1); if (m >= 3) pulse(tanks[2], 1.05); }, 2200);
    arcSet(v.querySelector('.ring'), bonuses(), true);
    gsap.to(v.querySelector('[data-a="six"]'), { scaleX: 1, duration: .9, delay: 1.9, ease: 'power3.out' });
  };

  // ═════════════ концепция 2 ═════════════
  const ADD = [7200, 12400, 23400, 9500, 12000, 7500];       // зарплата 10-го, 72 000 ₽: прибавка конвертам (в порядке конвертов счёта)
  wire['c2-home'] = v => {
    v._ready = [2, 3, 4].map(i => v.querySelector(`[data-env="${i}"] .ts`).innerHTML);
    on(v, '[data-env]', t => { const i = +t.dataset.env;
      if (i === 1) go('c2-family'); else if (i === 3) go('c2-autopay'); else if (i === 5) go('c2-borrow', 'rise');
      else if (i === 0) toast(`Запас: ${fmt1(B.env[0] / EXP)} месяца жизни. Цель — 3`); else toast(B.salary ? 'Конверт заплатит сам в срок' : 'Конверт ждёт зарплату'); });
    on(v, '.card.flat', () => B.salary ? go('c2-rule') : go('c2-salary', 'rise'));
    on(v, '.nav .ic-btn:last-child', () => go('c2-new'));
  };
  const render2 = (v, animate) => {
    const tot = v.querySelector('[data-anim="c2-total"]'), sum = B.env.reduce((a, x) => a + x, 0);
    const prev = B.shown;
    if (animate && prev) count(tot, prev.sum, sum, rub, 1.2); else tot.textContent = rub(sum);
    B.env.forEach((x, i) => {
      const el = v.querySelector(`[data-env="${i}"] .sm`), seg = v.querySelector(`[data-seg="${i}"]`);
      if (animate && prev && prev.env[i] !== x) { setTimeout(() => { count(el, prev.env[i], x); pulse(v.querySelector(`[data-env="${i}"] .av`), 1.16); }, i * 130); gsap.to(seg, { flexGrow: Math.max(x / 1000, .001), opacity: x ? 1 : 0, duration: .9, delay: i * .13 }); }
      else { el.textContent = rub(x); gsap.set(seg, { flexGrow: Math.max(x / 1000, .001), opacity: x ? 1 : 0 }); }
    });
    [2, 3, 4].forEach((i, k) => { v.querySelector(`[data-env="${i}"] .ts`).innerHTML = B.env[i] ? v._ready[k] : 'ждёт зарплату'; });
    v.querySelector('[data-env="0"] .ts').textContent = `${fmt1(B.env[0] / EXP)} месяца жизни · цель 3`;
    const lf = v.querySelector('[data-a="life"]'), m = B.env[0] / EXP; if (animate && prev && prev.m !== m) count(lf, prev.m, m, fmt1, .9); else lf.textContent = fmt1(m);
    v.querySelector('[data-a="today"]').textContent = fmt2((B.env[0] + B.env[1]) * 11.5 / 36500);
    v.querySelector('[data-a="saveSum"]').textContent = rub(B.env[0] + B.env[1]); v.querySelector('[data-a="spendSum"]').textContent = rub(sum - B.env[0] - B.env[1]);
    v.querySelector('[data-env="1"] .ts').textContent = `к 1 июня · ${Math.round(B.env[1] / 1200)}% цели`;
    const link = v.querySelector('.card.flat');
    link.querySelector('.ts').textContent = B.salary ? 'Следующая раскладка — аванс 25 декабря' : 'Получить зарплату 72 000 ₽';
    link.style.boxShadow = B.salary ? '' : 'inset 0 0 0 1.5px rgba(87,217,138,.6)';
    B.shown = { sum, env: [...B.env], m };
  };
  enter['c2-home'] = v => render2(v, !!B.shown);

  wire['c2-salary'] = v => on(v, '.foot .cta', () => { if (!B.salary) { B.salary = true; B.env = B.env.map((x, i) => x + ADD[i]); } back(); });
  enter['c2-salary'] = v => { v.querySelectorAll('[data-fall]').forEach(f => { gsap.set(f, { opacity: 0, y: 16 }); gsap.set(f.querySelector('.bar i'), { scaleX: 0, transformOrigin: '0 50%' }); gsap.set(f.querySelector('.check'), { scale: .5, opacity: 0 }); f.querySelector('.sm').textContent = rub(0); }); gsap.set(v.querySelectorAll('[data-anim="sal-done"], [data-anim="sal-buf"]'), { opacity: 0, y: 18 }); v.querySelector('[data-anim="sal-num"]').textContent = '+' + rub(0); };
  after['c2-salary'] = v => {
    const num = v.querySelector('[data-anim="sal-num"]'), falls = [...v.querySelectorAll('[data-fall]')], vals = [23400, 9500, 12000, 12400, 7200, 7500];
    count(num, 0, 72000, x => '+' + rub(x), 1);
    setTimeout(() => {
      if (cur !== 'c2-salary') return;
      const src = centerOf(num);
      falls.forEach((f, i) => {
        const d = i * .34, amt = f.querySelector('.sm'), to = centerOf(amt);
        gsap.to(f, { opacity: 1, y: 0, duration: .4, delay: d });
        if (!reduced) [0, .07, .14].forEach((dd, k) => { const c = add('coin'); gsap.timeline({ delay: d + .1 + dd, onComplete: () => c.remove() }).set(c, { x: src.x - 70 + k * 14, y: src.y, scale: .4, opacity: 0 }).to(c, { opacity: 1, scale: .7, duration: .12 }).to(c, { x: to.x, duration: .44, ease: 'power1.in' }, '<.04').to(c, { y: to.y, duration: .44, ease: 'power2.out' }, '<').to(c, { opacity: 0, scale: .25, duration: .12 }, '-=.06'); });
        setTimeout(() => { count(amt, 0, vals[i], rub, .5); pulse(amt, 1.08); }, (d + .56) * 1000);
        gsap.to(f.querySelector('.bar i'), { scaleX: 1, duration: .6, delay: d + .6, ease: 'power3.out' });
        gsap.to(f.querySelector('.check'), { scale: 1, opacity: 1, duration: .4, delay: d + 1, ease: 'back.out(2.4)' });
      });
      gsap.to(v.querySelectorAll('[data-anim="sal-done"], [data-anim="sal-buf"]'), { opacity: 1, y: 0, duration: .5, stagger: .22, delay: 2.7, ease: 'power3.out' });
    }, 900);
  };

  wire['c2-new'] = v => {
    on(v, '.body > .row.gap10 > .card', t => v.querySelectorAll('.body > .row.gap10 > .card').forEach(c => { c.classList.toggle('hi', c === t); c.querySelector('.radio').classList.toggle('on', c === t); }));
    on(v, '.chip', t => v.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === t)));
    on(v, '[data-a="term"]', () => toast('Срочный конверт: ставка выше на 1 п.п., если не трогать до даты'));
    on(v, '.foot .cta', () => { toast('Конверт создан'); go('c2-rule'); });
  };
  wire['c2-rule'] = v => { on(v, '.grip', () => toast('Порядок меняется перетаскиванием')); on(v, '.edit', () => toast('Сумму можно изменить: нажмите и введите')); on(v, '.foot .cta', () => { toast('Правило сохранено'); home('c2-home', 'back'); }); };
  wire['c2-autopay'] = v => on(v, '.foot .cta', () => toast('Сумму и дату можно поменять в любой момент'));
  enter['c2-autopay'] = v => gsap.set(v.querySelector('[data-anim="push"]'), { yPercent: -180, opacity: 0, pointerEvents: 'none' });
  after['c2-autopay'] = v => { const p = v.querySelector('[data-anim="push"]'); gsap.timeline({ delay: .6 }).to(p, { yPercent: 0, opacity: 1, duration: .6, ease: E }).to(p, { yPercent: -180, opacity: 0, duration: .28, ease: 'power2.out' }, '+=3.2'); };

  const BOR = { vac: 'Взять из «Отпуска» и оплатить', buf: 'Взять из запаса и оплатить', parts: 'Оплатить частями' };
  wire['c2-borrow'] = v => {
    on(v, '.sheet > .opt', t => { oPick(v, oList(v).indexOf(t)); arm(v, BOR[oKind(v)]); });
    on(v, '.scrim', () => back());
    on(v, '.sheet .cta', () => {
      const k = oKind(v), free = Math.min(B.env[5], 6200); if (!k) return toast('Выберите, откуда взять деньги');
      if (k === 'vac') { B.env[5] -= free; B.env[1] = Math.max(B.env[1] - 11800, 0); } else if (k === 'buf') { B.env[5] -= free; B.env[0] -= 11800; } else B.env[5] = Math.max(B.env[5] - 3000, 0);
      back(); setTimeout(() => toast(k === 'parts' ? 'Оплачено. Первый платёж — 3 000 ₽' : 'Оплачено 18 000 ₽. Вернёте за 30 дней — стаж сохранится'), 500);
    });
  };
  enter['c2-borrow'] = v => { oPick(v, -1); arm(v, ''); oList(v)[1].querySelector('.ts').textContent = `запас: ${fmt1(B.env[0] / EXP)} → ${fmt1((B.env[0] - 11800) / EXP)} месяца жизни`; gsap.set(v.querySelector('.sheet'), { yPercent: 104 }); gsap.set(v.querySelector('.scrim'), { opacity: 0 }); };
  after['c2-borrow'] = sheetIn;

  const famCards = v => [...v.querySelectorAll('.body > .card')];
  wire['c2-family'] = v => {
    on(v, '.foot .cta', () => { if (B.env[5] < 5000) return toast('В свободных меньше 5 000 ₽'); B.env[5] -= 5000; B.env[1] += 5000; paintFam(v, true); toast('+5 000 ₽ из свободных'); });
    on(v, '.nav .ic-btn:last-child', () => go('c2-invite'));
    const inv = famCards(v)[0].querySelectorAll('.row')[2]; inv.classList.add('tp'); inv.addEventListener('click', () => go('c2-invite'));
    on(v, '.body > .col, .body > .bar', () => go('c2-forecast'));
  };
  const paintFam = (v, animate) => {
    const tot = B.env[1], mx = B.salary ? 18000 : 12000, an = Math.max(tot - mx, 0), num = v.querySelector('[data-anim="fam-num"]'), rows = famCards(v)[0].querySelectorAll('.row .sm'), bar = v.querySelector('[data-anim="fam-bar"]'), feed = famCards(v)[1];
    if (animate && v._tot != null) { count(num, v._tot, tot); count(rows[0], v._an, an); pulse(num, 1.05); } else { num.textContent = rub(tot); rows[0].textContent = rub(an); }
    rows[1].textContent = rub(mx);
    // полоса и лента двигаются только через transform: полоса растёт масштабом, строки ленты съезжают вниз под новую
    const w1 = Math.min(tot / 1200, 100), w0 = v._w || w1; bar.style.width = w1 + '%'; gsap.fromTo(bar, { scaleX: w0 / w1 }, { scaleX: 1, transformOrigin: '0 50%', duration: animate ? .8 : 0, ease: 'power3.out' }); v._w = w1;
    if (animate) { feed.insertAdjacentHTML('afterbegin', '<div class="row"><div class="av s round g txt mint" style="font-size:14px">А</div><div class="col sp"><div class="tb">Анна внесла</div><div class="ts">только что</div></div><div class="sm mint">+5&nbsp;000&nbsp;₽</div></div>'); [...feed.children].forEach((r, i) => { if (i > 3) r.remove(); }); const rows = [...feed.children], h = rows[0].getBoundingClientRect().height / (screen.getBoundingClientRect().width / 440) + 13; gsap.from(rows[0], { opacity: 0, y: -10, duration: .35, ease: 'power3.out' }); gsap.from(rows.slice(1), { y: -h, duration: .45, ease: 'power3.out' }); }
    v._tot = tot; v._an = an;
  };
  enter['c2-family'] = v => paintFam(v, false);

  wire['c2-invite'] = v => {
    const roles = v.querySelector('.body > .card'); roles.querySelectorAll('.row').forEach(r => { r.classList.add('tp'); r.addEventListener('click', () => roles.querySelectorAll('.radio').forEach(x => x.classList.toggle('on', r.contains(x)))); });
    on(v, '.foot .cta', () => toast('Ссылка готова: её можно отправить в любой мессенджер'));
  };
  const FC = [['10 мая', 'Ускорить на 2&nbsp;000&nbsp;₽'], ['10 марта', 'Пригласить Максима'], ['18 мая', 'Включить округление']];
  wire['c2-forecast'] = v => {
    const cards = () => [...v.querySelectorAll('.body > .card')].slice(1), big = v.querySelector('.body > .col .big');
    on(v, '.body > .card', t => { const i = cards().indexOf(t); if (i < 0) return; cards().forEach((c, k) => { c.classList.toggle('hi', k === i); c.classList.toggle('flat', k !== i); c.querySelector('.radio').classList.toggle('on', k === i); }); big.textContent = FC[i][0]; pulse(big, 1.06); v.querySelector('.foot .cta').innerHTML = FC[i][1]; });
    on(v, '.foot .cta', () => { toast('Готово: цель придёт раньше'); back(); });
  };
  enter['c2-forecast'] = v => { v.querySelector('.body > .col .big').textContent = '1 июня'; const l = v.querySelector('[data-anim="fc-line"]'), n = l.getTotalLength(); gsap.fromTo(l, { strokeDasharray: n, strokeDashoffset: n }, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut', delay: .4 }); };

  // запуск
  document.fonts.ready.then(() => { nav('hub', 'none'); document.body.classList.add('ready'); window.__app = { go, home, back, state: () => ({ A, B, cur, stack: stack.length }) }; });
})();

</script>
</body>
</html>
